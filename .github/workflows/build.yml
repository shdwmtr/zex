name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Let any bundled AppImage tooling run without FUSE (GitHub-hosted Linux
  # runners don't have it set up for unprivileged mounts).
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  macos:
    name: macOS (${{ matrix.label }})
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            label: Apple Silicon
          - target: x86_64-apple-darwin
            arch: x86_64
            label: Intel
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}

      # Recent Xcode versions split the Metal shader compiler out of the
      # base install; GitHub's macOS runner images normally already carry
      # it, but this is a harmless no-op if so and a real fix if not.
      - name: Ensure the Metal toolchain is installed
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Install librsvg
        run: brew install librsvg

      - name: Build Zex.app
        run: make app

      - name: Zip the app bundle
        run: |
          cd target/macos
          ditto -c -k --sequesterRsrc --keepParent Zex.app zex-macos-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: zex-macos-${{ matrix.arch }}
          path: target/macos/zex-macos-${{ matrix.arch }}.zip

  linux-appimage:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config librsvg2-bin \
            libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig1-dev libvulkan-dev

      - name: Build
        run: cargo build --profile optimized-release

      - name: Assemble AppDir
        run: |
          set -eu
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps AppDir/usr/share/icons/hicolor/scalable/apps
          cp target/optimized-release/zex AppDir/usr/bin/zex
          cp packaging/zex.desktop AppDir/usr/share/applications/zex.desktop
          rsvg-convert -w 512 -h 512 assets/icon.svg -o zex-icon-512.png
          cp zex-icon-512.png AppDir/usr/share/icons/hicolor/512x512/apps/zex.png
          cp assets/icon.svg AppDir/usr/share/icons/hicolor/scalable/apps/zex.svg

      - name: Download linuxdeploy
        run: |
          curl -sSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy

      - name: Build AppImage
        run: |
          ./linuxdeploy \
            --appdir AppDir \
            --desktop-file packaging/zex.desktop \
            --icon-file zex-icon-512.png \
            --output appimage
          mv Zex-x86_64.AppImage zex-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: zex-linux-x86_64
          path: zex-linux-x86_64.AppImage

  release:
    name: Semantic Release
    needs: [macos, linux-appimage]
    # Only main gets to cut releases; PRs and other branches just build.
    # semantic-release itself decides, from Conventional Commits since the
    # last release, whether *this* push actually warrants a new version -
    # a run with only e.g. docs/chore commits publishes nothing.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release needs full history + tags to figure out what
          # changed since the last release.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
